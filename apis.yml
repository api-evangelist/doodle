description: >
  Doodle is a meeting scheduling platform that simplifies group coordination through
  polls, booking pages, 1:1 meeting links, and sign-up sheets. The platform automatically
  finds optimal meeting times by reading participant calendars and supports cross-timezone
  scheduling for distributed teams. Doodle integrates with Google Calendar, Microsoft
  Office 365, Zoom, Microsoft Teams, Google Meet, Webex, Stripe, and Zapier for
  workflow automation. The legacy public REST API has been officially deprecated and
  Doodle no longer supports new API integrations; enterprise customers with existing
  API implementations may contact support for continued assistance. Automation is
  now primarily available via Zapier on Professional and higher plans.
